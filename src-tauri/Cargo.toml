[package]
name = "oneboard-privacy-guard"
version = "1.0.0"
description = "Local-first sensitive-data protection for text and documents."
authors = ["OneBoard"]
license = "MIT"
repository = "https://github.com/phat7000/OneBoardPrivacyGuard"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "oneboard_privacy_guard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "OneBoardPrivacyGuard"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-http = "=2.6.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
